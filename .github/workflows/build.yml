name: Create new release

on:
  push:
    branches:
      - "**"
    tags:
      - "!**"

jobs:
  build:
    runs-on: ubuntu-22.04
    #runs-on: ubuntu-latest

    steps:
          - uses: actions/checkout@v6
          - name: Install fuse and libfuse2
            run: sudo apt install fuse libfuse2

          - name: Get appimagetool
            run: |
              set -x
              version_go_appimage=$(wget -q -O - https://api.github.com/repos/probonopd/go-appimage/releases | grep "\"name.*appimagetool-.*-x86_64.AppImage\"" | head -n 1 | cut -d '-' -f2)
              echo "version_go_appimage: $version_go_appimage"
              wget -q "https://github.com/probonopd/go-appimage/releases/download/continuous/appimagetool-$version_go_appimage-x86_64.AppImage" -O appimagetool-x86_64.AppImage
              chmod +x appimagetool-x86_64.AppImage
              pwd; ls -lah

          - name: Get Czur_Scanner_et24_25pro
            run: |
              set -x
              version=$(grep -o "Czur_Scanner_et24_25pro_AppImage:.*" README.md | cut -d ' ' -f2)
              echo "Czur_Scanner_et24_25pro_AppImage version: $version"

              # Download deb
              wget -q https://resource.czur-files.com/software/linux/differ/scanner_${version}_amd64_en_2512021.deb

              # Extract deb
              ar x scanner_1.0.20250413_amd64_en_2512021.deb

              # Delete files not needed
              rm scanner_1.0.20250413_amd64_en_2512021.deb control.tar.xz debian-binary

              # Create folder
              mkdir Czur_Scanner_et24_25pro_AppImage/

              # Extract data
              tar -xJf data.tar.xz -C Czur_Scanner_et24_25pro_AppImage/

              rm data.tar.xz
              pwd; ls -lah

          - name: Make Appimage
            run: |
              set -x
              tag=1 #1
              version=$(grep -o "Czur_Scanner_et24_25pro_AppImage:.*" README.md | cut -d ' ' -f2)
              echo "Czur_Scanner_et24_25pro_AppImage version: $version - Tag: $tag"

              cp README.md Czur_Scanner_et24_25pro_AppImage/
              cd Czur_Scanner_et24_25pro_AppImage/

              # Move files from up from /tmp/
              mv tmp/opt/ ./
              rmdir tmp/

              # Copy icon e shortcut
              cp usr/share/icons/czurscanner.ico Czur_Scanner_et24_25pro.ico
              cp usr/share/applications/scanner.desktop Czur_Scanner_et24_25pro.desktop 

              # Change name to Czur_Scanner_et24_25pro
              sed 's/Name=CzurScanner/Name=Czur_Scanner_et24_25pro_AppImage/' Czur_Scanner_et24_25pro.desktop

              # Change ico to Czur_Scanner_et24_25pro
              sed 's/Icon=\/opt\/apps\/scanner\/ico\/CzurScanner.ico/Icon=Czur_Scanner_et24_25pro/' Czur_Scanner_et24_25pro.desktop 

              cat Czur_Scanner_et24_25pro.desktop

              echo '#!/bin/bash
              HERE="$(dirname "$(readlink -f "${0}")")"
              cd "$HERE"/

              cd opt/apps/scanner/

              bash -c \'xrdb -query | grep -q "Xft.dpi"  || echo "Xft.dpi:  96" | xrdb -merge; env LD_PRELOAD=./libczurusb-1.0.so GDK_BACKEND=x11 ./CzurScanner %F\'

              ' > AppRun

              chmod +x AppRun
              cat AppRun

              pwd; ls -lah

              cd ../
              ARCH=x86_64 VERSION="${version}-1_JB" ./appimagetool-x86_64.AppImage Czur_Scanner_et24_25pro/
              pwd; ls -lah

              fileName=$(ls Czur_Scanner_et24_25pro*.AppImage)
              echo "fileName: $fileName"
              md5sum "$fileName" > "${fileName}.md5"
              pwd; ls -lah

          - uses: xresloader/upload-to-github-release@v1
            env:
              GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            with:
              file: "Czur_Scanner_et24_25pro*.AppImage; Czur_Scanner_et24_25pro*.zsync; Czur_Scanner_et24_25pro*.md5"
              #overwrite: true
              verbose: true
              draft: false
              default_release_name: "Czur_Scanner_et24_25pro V in AppImage"
