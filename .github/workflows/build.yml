name: Create new release

on:
  push:
    branches:
      - "**"
    tags:
      - "!**"

jobs:
  build:
    runs-on: ubuntu-22.04
    #runs-on: ubuntu-latest

    steps:
          - uses: actions/checkout@v6
          - name: Install fuse and libfuse2
            run: sudo apt install fuse libfuse2

          - name: Get appimagetool
            run: |
              set -x
              version_go_appimage=$(wget -q -O - https://api.github.com/repos/probonopd/go-appimage/releases | grep "\"name.*appimagetool-.*-x86_64.AppImage\"" | head -n 1 | cut -d '-' -f2)
              echo "version_go_appimage: $version_go_appimage"
              wget -q "https://github.com/probonopd/go-appimage/releases/download/continuous/appimagetool-$version_go_appimage-x86_64.AppImage" -O appimagetool-x86_64.AppImage
              chmod +x appimagetool-x86_64.AppImage
              pwd; ls -lah

          - name: Get Czur_Scanner_et24_25pro
            run: |
              set -x
              version=$(grep -o "Czur_Scanner_et24_25pro_AppImage:.*" README.md | cut -d ' ' -f2)
              echo "Czur_Scanner_et24_25pro_AppImage version: $version"

              # Download deb
              wget -q https://resource.czur-files.com/software/linux/differ/scanner_${version}_amd64_en_2512021.deb

              # Extract deb
              ar x scanner_1.0.20250413_amd64_en_2512021.deb

              # Delete files not needed
              rm scanner_1.0.20250413_amd64_en_2512021.deb control.tar.xz debian-binary

              # Create folder
              mkdir Czur_Scanner_et24_25pro_AppImage/

              # Extract data
              tar -xJf data.tar.xz -C Czur_Scanner_et24_25pro_AppImage/

              rm data.tar.xz
              pwd; ls -lah

          - name: Make Appimage
            run: |
              set -x
              tag=1 #1
              version=$(grep -o "Czur_Scanner_et24_25pro_AppImage:.*" README.md | cut -d ' ' -f2)
              echo "Czur_Scanner_et24_25pro_AppImage version: $version - Tag: $tag"

              cp README.md Czur_Scanner_et24_25pro_AppImage/
              cd Czur_Scanner_et24_25pro_AppImage/

              echo '#!/bin/bash
              HERE="$(dirname "$(readlink -f "${0}")")"
              if [ "$(id -u)" != "0" ]; then
                  cat "$HERE/README.md"
                  echo -e "\n # Error - Run this AppImage as root! #\n"
                  exit 1
              fi

              EXEC="${HERE}/ventoy/VentoyGUI.x86_64"
              exec "${EXEC}"' > AppRun

              sed -i "s/ventoy/ventoy-$version/" AppRun
              chmod +x AppRun
              cat AppRun

              echo '[Desktop Entry]
              Name=Ventoy
              Exec=VentoyGUI.x86_64
              Icon=Ventoy
              Type=Application
              Categories=Utility' > Ventoy.desktop
              chmod +x Ventoy.desktop
              cat Ventoy.desktop

              ln -s ventoy-$version/WebUI/static/img/VentoyLogo.png Ventoy.png
              pwd; ls -lah

              cd ../
              ARCH=x86_64 VERSION="${version}-1_JB" ./appimagetool-x86_64.AppImage squashfs-root/
              pwd; ls -lah

              fileName=$(ls Ventoy*.AppImage)
              echo "fileName: $fileName"
              md5sum "$fileName" > "${fileName}.md5"
              pwd; ls -lah

          - uses: xresloader/upload-to-github-release@v1
            env:
              GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            with:
              file: "Ventoy*.AppImage; Ventoy*.zsync; Ventoy*.md5"
              #overwrite: true
              verbose: true
              draft: false
              default_release_name: "Ventoy V in AppImage"
